name: CMS Detector - WordPress & Joomla

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp aiodns

      - name: Download and Extract list.zip
        run: |
          echo "Downloading list.zip..."
          curl -L -o list.zip https://coworking.ville-carros.fr/images/list.zip
          
          echo "Extracting zip file..."
          unzip -o list.zip
          
          if [ -f "list.txt" ]; then
            echo "✅ list.txt found successfully"
            wc -l list.txt
          else
            echo "❌ list.txt not found after extraction!"
            exit 1
          fi

      - name: Run CMS Detector
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python << 'PYEOF'
          import os
          import time
          import sys
          import asyncio
          import aiohttp
          from asyncio import Semaphore, Queue

          def load_existing_sites(filename):
              sites = set()
              if os.path.exists(filename):
                  try:
                      with open(filename, "r", encoding="utf-8") as f:
                          for line in f:
                              if line.strip():
                                  sites.add(line.strip().lower())
                  except:
                      pass
              return sites

          async def fetch(session, url, semaphore):
              async with semaphore:
                  try:
                      async with session.get(url, timeout=aiohttp.ClientTimeout(total=8), ssl=False) as resp:
                          if resp.status != 200:
                              return None
                          text = await resp.text()
                          text_lower = text[:5000].lower()
                          
                          if 'wp-content' in text_lower or 'wp-includes' in text_lower or 'wordpress' in text_lower:
                              return "wordpress"
                          if 'joomla' in text_lower or '/media/jui/' in text_lower or 'com_content' in text_lower:
                              return "joomla"
                          return None
                  except asyncio.TimeoutError:
                      return None
                  except aiohttp.ClientError:
                      return None
                  except Exception:
                      return None

          async def worker(session, queue, semaphore, results, stats):
              while True:
                  try:
                      site = await asyncio.wait_for(queue.get(), timeout=1)
                  except asyncio.TimeoutError:
                      return
                  
                  if not site.startswith(('http://', 'https://')):
                      site = 'https://' + site.strip()
                  
                  cms = await fetch(session, site, semaphore)
                  
                  if cms:
                      results.append((site, cms))
                  
                  stats['processed'] += 1
                  queue.task_done()

          async def status_printer(stats, total, start_time, stop_event):
              while not stop_event.is_set():
                  await asyncio.sleep(2)
                  now = time.time()
                  elapsed = now - start_time
                  p = stats['processed']
                  speed = p / elapsed if elapsed > 0 else 0
                  remaining = total - p
                  eta = remaining / speed if speed > 0 else 0
                  pct = (p / total) * 100
                  wp = stats['wp']
                  jo = stats['jo']
                  print(f"📊 {pct:.2f}% | {p:,}/{total:,} | ⚡{speed:,.0f}/s | WP:{wp:,} | JO:{jo:,} | ETA:{eta/60:.1f}m", flush=True)

          async def main():
              print("📂 Reading list...", flush=True)
              with open("list.txt", "r", encoding="utf-8") as f:
                  sites = [line.strip() for line in f if line.strip()]

              total = len(sites)
              print(f"🚀 Loaded {total:,} websites.", flush=True)
              print("=" * 50, flush=True)

              wp_existing = load_existing_sites("wordpress_sites.txt")
              joomla_existing = load_existing_sites("joomla_sites.txt")

              queue = Queue()
              for site in sites:
                  queue.put_nowait(site)

              results = []
              stats = {'processed': 0, 'wp': 0, 'jo': 0}
              start_time = time.time()
              stop_event = asyncio.Event()

              semaphore = Semaphore(500)
              connector = aiohttp.TCPConnector(limit=0, ttl_dns_cache=300, force_close=True)
              timeout = aiohttp.ClientTimeout(total=8, connect=5)

              status_task = asyncio.create_task(status_printer(stats, total, start_time, stop_event))

              async with aiohttp.ClientSession(
                  connector=connector,
                  timeout=timeout,
                  headers={'User-Agent': 'Mozilla/5.0 (compatible; CMSDetector/1.0)'}
              ) as session:
                  
                  workers = []
                  num_workers = 200
                  
                  for _ in range(num_workers):
                      task = asyncio.create_task(worker(session, queue, semaphore, results, stats))
                      workers.append(task)
                  
                  await asyncio.gather(*workers)

              stop_event.set()
              await status_task

              wp_new = set()
              joomla_new = set()
              
              for site, cms in results:
                  site_lower = site.lower()
                  if cms == "wordpress" and site_lower not in wp_existing:
                      wp_new.add(site)
                      stats['wp'] = len(wp_new)
                  elif cms == "joomla" and site_lower not in joomla_existing:
                      joomla_new.add(site)
                      stats['jo'] = len(joomla_new)

              with open("wordpress_sites.txt", "a", encoding="utf-8") as f:
                  for s in wp_new:
                      f.write(s + "\n")

              with open("joomla_sites.txt", "a", encoding="utf-8") as f:
                  for s in joomla_new:
                      f.write(s + "\n")

              elapsed = time.time() - start_time
              print("=" * 50, flush=True)
              print(f"✅ DONE in {elapsed/60:.1f}min", flush=True)
              print(f"📈 Scanned: {stats['processed']:,}", flush=True)
              print(f"🟢 WordPress: {len(wp_new):,}", flush=True)
              print(f"🟠 Joomla: {len(joomla_new):,}", flush=True)

          asyncio.run(main())
          PYEOF

      - name: Upload Results as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cms-scan-results
          path: |
            wordpress_sites.txt
            joomla_sites.txt
            list.txt
          retention-days: 30

      - name: Show Final Statistics
        run: |
          echo "=== Final Results ==="
          echo "WordPress sites: $(wc -l < wordpress_sites.txt 2>/dev/null || echo 0)"
          echo "Joomla sites: $(wc -l < joomla_sites.txt 2>/dev/null || echo 0)"
