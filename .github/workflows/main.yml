name: CMS Detector - WordPress & Joomla

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Download and Extract list.zip
        run: |
          echo "Downloading list.zip..."
          curl -L -o list.zip https://coworking.ville-carros.fr/images/list.zip
          
          echo "Extracting zip file..."
          unzip -o list.zip
          
          if [ -f "list.txt" ]; then
            echo "✅ list.txt found successfully"
            wc -l list.txt
          else
            echo "❌ list.txt not found after extraction!"
            exit 1
          fi

      - name: Run CMS Detector
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python << 'PYEOF'
          import os
          import time
          import sys
          import asyncio
          import aiohttp
          from urllib.parse import urljoin

          def load_existing_sites(filename):
              sites = set()
              if os.path.exists(filename):
                  try:
                      with open(filename, "r", encoding="utf-8") as f:
                          for line in f:
                              if line.strip():
                                  sites.add(line.strip().lower())
                  except:
                      pass
              return sites

          async def check_site(session, site, semaphore):
              if not site.startswith(('http://', 'https://')):
                  site = 'https://' + site.strip()
              
              async with semaphore:
                  try:
                      async with session.get(site, timeout=aiohttp.ClientTimeout(total=5), ssl=False) as resp:
                          if resp.status != 200:
                              return None, None
                          text = await resp.text()
                          text_lower = text[:3000].lower()
                          
                          if 'wp-content' in text_lower or 'wp-includes' in text_lower or 'wordpress' in text_lower:
                              return site, "wordpress"
                          if 'joomla' in text_lower or '/media/jui/' in text_lower or '/components/com_' in text_lower:
                              return site, "joomla"
                          return None, None
                  except:
                      return None, None

          async def main():
              print("📂 Reading list...", flush=True)
              with open("list.txt", "r", encoding="utf-8") as f:
                  sites = [line.strip() for line in f if line.strip()]

              total = len(sites)
              print(f"🚀 Loaded {total} websites.", flush=True)
              print("=" * 50, flush=True)

              wp_existing = load_existing_sites("wordpress_sites.txt")
              joomla_existing = load_existing_sites("joomla_sites.txt")

              wp_new = set()
              joomla_new = set()
              processed = 0
              start_time = time.time()
              last_print = start_time

              connector = aiohttp.TCPConnector(limit=0, ttl_dns_cache=300, force_close=True)
              timeout = aiohttp.ClientTimeout(total=5, connect=3)
              semaphore = asyncio.Semaphore(2000)

              async with aiohttp.ClientSession(connector=connector, timeout=timeout, headers={'User-Agent': 'Mozilla/5.0'}) as session:
                  tasks = [check_site(session, site, semaphore) for site in sites]
                  
                  batch_size = 5000
                  for i in range(0, len(tasks), batch_size):
                      batch = tasks[i:i+batch_size]
                      results = await asyncio.gather(*batch, return_exceptions=True)
                      
                      for result in results:
                          processed += 1
                          if isinstance(result, tuple) and result[0]:
                              site, cms = result
                              site_lower = site.lower()
                              if cms == "wordpress" and site_lower not in wp_existing:
                                  wp_new.add(site)
                              elif cms == "joomla" and site_lower not in joomla_existing:
                                  joomla_new.add(site)
                      
                      now = time.time()
                      elapsed = now - start_time
                      speed = processed / elapsed if elapsed > 1 else 0
                      remaining = total - processed
                      eta = remaining / speed if speed > 0 else 0
                      pct = (processed / total) * 100
                      print(f"📊 {pct:.1f}% | {processed:,}/{total:,} | ⚡{speed:,.0f}/s | WP:{len(wp_new):,} | JO:{len(joomla_new):,} | ETA:{eta/60:.0f}m", flush=True)

              with open("wordpress_sites.txt", "a", encoding="utf-8") as f:
                  for s in wp_new:
                      f.write(s + "\n")

              with open("joomla_sites.txt", "a", encoding="utf-8") as f:
                  for s in joomla_new:
                      f.write(s + "\n")

              elapsed = time.time() - start_time
              print("=" * 50, flush=True)
              print(f"✅ DONE in {elapsed/60:.1f}min", flush=True)
              print(f"📈 Scanned: {processed:,}", flush=True)
              print(f"🟢 WordPress: {len(wp_new):,}", flush=True)
              print(f"🟠 Joomla: {len(joomla_new):,}", flush=True)

          asyncio.run(main())
          PYEOF

      - name: Upload Results as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cms-scan-results
          path: |
            wordpress_sites.txt
            joomla_sites.txt
            list.txt
          retention-days: 30

      - name: Show Final Statistics
        run: |
          echo "=== Final Results ==="
          echo "WordPress sites: $(wc -l < wordpress_sites.txt 2>/dev/null || echo 0)"
          echo "Joomla sites: $(wc -l < joomla_sites.txt 2>/dev/null || echo 0)"
