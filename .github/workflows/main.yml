name: CMS Detector - WordPress & Joomla

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 colorama

      - name: Download and Extract list.zip
        run: |
          echo "Downloading list.zip..."
          curl -L -o list.zip https://coworking.ville-carros.fr/images/list.zip
          
          echo "Extracting zip file..."
          unzip -o list.zip
          
          if [ -f "list.txt" ]; then
            echo "✅ list.txt found successfully"
            wc -l list.txt
          else
            echo "❌ list.txt not found after extraction!"
            exit 1
          fi

      - name: Run CMS Detector
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python << 'PYEOF'
          import os
          import time
          import sys
          from concurrent.futures import ThreadPoolExecutor, as_completed, TimeoutError
          from urllib.parse import urljoin
          from threading import Lock

          import requests
          from bs4 import BeautifulSoup

          print_lock = Lock()

          def safe_print(*args, **kwargs):
              with print_lock:
                  print(*args, **kwargs, flush=True)

          def load_existing_sites(filename):
              sites = set()
              if os.path.exists(filename):
                  try:
                      with open(filename, "r", encoding="utf-8") as f:
                          for line in f:
                              if line.strip():
                                  sites.add(line.strip().lower())
                  except:
                      pass
              return sites

          def is_wordpress(site_url):
              try:
                  headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
                  resp = requests.get(site_url, headers=headers, timeout=8, allow_redirects=True)
                  if resp.status_code != 200:
                      return False
                  text = resp.text.lower()
                  if 'wp-content' in text or 'wp-includes' in text or 'wordpress' in text:
                      return True
                  if requests.get(urljoin(site_url, '/wp-login.php'), headers=headers, timeout=5).status_code == 200:
                      return True
                  return False
              except:
                  return False

          def is_joomla(site_url):
              try:
                  headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
                  resp = requests.get(site_url, headers=headers, timeout=8, allow_redirects=True)
                  if resp.status_code != 200:
                      return False
                  text = resp.text.lower()
                  if '/media/jui/' in text or '/components/com_' in text or 'joomla' in text:
                      return True
                  if requests.get(urljoin(site_url, '/administrator/'), headers=headers, timeout=5).status_code == 200:
                      return True
                  return False
              except:
                  return False

          def check_site(site):
              if not site.startswith(('http://', 'https://')):
                  site = 'https://' + site.strip()
              
              if is_wordpress(site):
                  return site, "wordpress"
              elif is_joomla(site):
                  return site, "joomla"
              return None, None

          def main():
              safe_print("📂 Reading list.txt...")
              with open("list.txt", "r", encoding="utf-8") as f:
                  sites = [line.strip() for line in f if line.strip()[:5]]

              total = len(sites)
              safe_print(f"🚀 Loaded {total} websites.")
              safe_print("=" * 60)

              wp_existing = load_existing_sites("wordpress_sites.txt")
              joomla_existing = load_existing_sites("joomla_sites.txt")

              wp_new = set()
              joomla_new = set()
              processed = 0
              start_time = time.time()

              max_workers = 300
              batch_size = 1000
              
              # نضيف المواقع على دفعات بدل الكل مرة واحدة
              for i in range(0, total, batch_size):
                  batch = sites[i:i+batch_size]
                  
                  with ThreadPoolExecutor(max_workers=max_workers) as executor:
                      futures = {executor.submit(check_site, site): site for site in batch}
                      
                      for future in as_completed(futures):
                          try:
                              site, cms = future.result(timeout=15)
                          except:
                              site, cms = None, None
                          
                          processed += 1
                          
                          if site:
                              site_lower = site.lower()
                              if cms == "wordpress" and site_lower not in wp_existing:
                                  wp_new.add(site)
                                  safe_print(f"🟢 [WP] {site}")
                              elif cms == "joomla" and site_lower not in joomla_existing:
                                  joomla_new.add(site)
                                  safe_print(f"🟠 [JO] {site}")
                          
                          if processed % 100 == 0:
                              elapsed = time.time() - start_time
                              speed = processed / elapsed if elapsed > 1 else 0
                              remaining = total - processed
                              pct = (processed / total) * 100 if total > 0 else 0
                              safe_print(f"📊 [{pct:.2f}%] {processed}/{total} | ⚡ {speed:.1f} sites/s | 🟢 WP: {len(wp_new)} | 🟠 JO: {len(joomla_new)} | ⏳ {remaining} left")

              with open("wordpress_sites.txt", "a", encoding="utf-8") as f:
                  for s in wp_new:
                      f.write(s + "\n")

              with open("joomla_sites.txt", "a", encoding="utf-8") as f:
                  for s in joomla_new:
                      f.write(s + "\n")

              elapsed = time.time() - start_time
              safe_print("=" * 60)
              safe_print("✅ SCAN COMPLETED!")
              safe_print(f"⏱️  Time: {elapsed:.1f}s")
              safe_print(f"📈 Total scanned: {processed}")
              safe_print(f"🟢 New WordPress: {len(wp_new)}")
              safe_print(f"🟠 New Joomla: {len(joomla_new)}")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Upload Results as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cms-scan-results
          path: |
            wordpress_sites.txt
            joomla_sites.txt
            list.txt
          retention-days: 30

      - name: Show Final Statistics
        run: |
          echo "=== Final Results ==="
          echo "WordPress sites: $(wc -l < wordpress_sites.txt 2>/dev/null || echo 0)"
          echo "Joomla sites: $(wc -l < joomla_sites.txt 2>/dev/null || echo 0)"
