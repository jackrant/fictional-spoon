name: CMS Detector - WordPress & Joomla

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp aiofiles

      - name: Download and Extract list.zip
        run: |
          echo "Downloading list.zip..."
          curl -L -o list.zip https://coworking.ville-carros.fr/images/list.zip
          
          echo "Extracting zip file..."
          unzip -o list.zip
          
          if [ -f "list.txt" ]; then
            echo "✅ list.txt found successfully"
            wc -l list.txt
          else
            echo "❌ list.txt not found after extraction!"
            exit 1
          fi

      - name: Run CMS Detector
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python << 'PYEOF'
          import os
          import time
          import sys
          import asyncio
          import aiohttp
          from urllib.parse import urlparse

          WP_KEYWORDS = [b'wp-content', b'wp-includes', b'wordpress']
          JO_KEYWORDS = [b'joomla', b'/media/jui/', b'/components/com_']

          def extract_domain(url):
              try:
                  parsed = urlparse(url)
                  return parsed.netloc.lower()
              except:
                  return url.lower()

          async def load_existing_sites(filename):
              sites = set()
              if os.path.exists(filename):
                  try:
                      async with aiofiles.open(filename, "r", encoding="utf-8") as f:
                          async for line in f:
                              line = line.strip()
                              if line:
                                  sites.add(line.lower())
                  except:
                      pass
              return sites

          async def check_site(session, site):
              if not site.startswith(('http://', 'https://')):
                  url = 'https://' + site.strip()
              else:
                  url = site.strip()
              
              try:
                  async with session.get(url, timeout=aiohttp.ClientTimeout(total=8), allow_redirects=True) as resp:
                      if resp.status != 200:
                          return None, None
                      chunk = await resp.content.read(4096)
                      for kw in WP_KEYWORDS:
                          if kw in chunk:
                              return url, "wordpress"
                      for kw in JO_KEYWORDS:
                          if kw in chunk:
                              return url, "joomla"
                      return None, None
              except:
                  return None, None

          async def main():
              print("📂 Reading list...", flush=True)
              with open("list.txt", "r", encoding="utf-8") as f:
                  sites = [line.strip() for line in f if line.strip()]

              total = len(sites)
              print(f"🚀 Loaded {total} websites.", flush=True)
              print("=" * 50, flush=True)

              wp_existing = await load_existing_sites("wordpress_sites.txt")
              joomla_existing = await load_existing_sites("joomla_sites.txt")

              wp_new = set()
              joomla_new = set()
              processed = 0
              start_time = time.time()
              last_print = start_time
              lock = asyncio.Lock()

              connector = aiohttp.TCPConnector(limit=500, limit_per_host=30, ttl_dns_cache=300)
              async with aiohttp.ClientSession(connector=connector, headers={'User-Agent': 'Mozilla/5.0'}) as session:
                  semaphore = asyncio.Semaphore(500)

                  async def process_site(site):
                      nonlocal processed, last_print
                      async with semaphore:
                          result = await check_site(session, site)
                      processed += 1
                      
                      if result[0]:
                          site_url, cms = result
                          domain = extract_domain(site_url)
                          if cms == "wordpress" and domain not in wp_existing:
                              wp_new.add(site_url)
                          elif cms == "joomla" and domain not in joomla_existing:
                              joomla_new.add(site_url)

                      now = time.time()
                      if now - last_print >= 3:
                          async with lock:
                              if now - last_print >= 3:
                                  elapsed = now - start_time
                                  speed = processed / elapsed if elapsed > 1 else 0
                                  remaining = total - processed
                                  eta = remaining / speed if speed > 0 else 0
                                  pct = (processed / total) * 100
                                  print(f"📊 {pct:.1f}% | {processed}/{total} | ⚡{speed:.0f}/s | WP:{len(wp_new)} | JO:{len(joomla_new)} | ETA:{eta/3600:.1f}h", flush=True)
                                  last_print = now

                  # معالجة على دفعات لتجنب استهلاك الذاكرة
                  batch_size = 100000
                  for start in range(0, total, batch_size):
                      batch = sites[start:start+batch_size]
                      tasks = [process_site(site) for site in batch]
                      await asyncio.gather(*tasks)

              # حفظ النتائج
              if wp_new:
                  with open("wordpress_sites.txt", "a", encoding="utf-8") as f:
                      f.write("\n".join(wp_new) + "\n")
              if joomla_new:
                  with open("joomla_sites.txt", "a", encoding="utf-8") as f:
                      f.write("\n".join(joomla_new) + "\n")

              elapsed = time.time() - start_time
              print("=" * 50, flush=True)
              print(f"✅ DONE in {elapsed/60:.1f}min", flush=True)
              print(f"📈 Scanned: {processed}", flush=True)
              print(f"🟢 WordPress: {len(wp_new)}", flush=True)
              print(f"🟠 Joomla: {len(joomla_new)}", flush=True)

          asyncio.run(main())
          PYEOF

      - name: Upload Results as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cms-scan-results
          path: |
            wordpress_sites.txt
            joomla_sites.txt
            list.txt
          retention-days: 30

      - name: Show Final Statistics
        run: |
          echo "=== Final Results ==="
          echo "WordPress sites: $(wc -l < wordpress_sites.txt 2>/dev/null || echo 0)"
          echo "Joomla sites: $(wc -l < joomla_sites.txt 2>/dev/null || echo 0)"
